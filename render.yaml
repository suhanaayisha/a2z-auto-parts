# Render Blueprint: one web service that serves the screens (Next.js) and the API (Express) together.
# In Render: New + → Blueprint → pick this repo. See README.md for the full steps.
services:
  - type: web
    name: a2z-auto-parts-web
    runtime: node
    plan: starter        # $7/month, never sleeps. "free" also works but sleeps after 15 min idle and takes ~1 min to wake.
    region: frankfurt    # keep in the same region as your MongoDB Atlas cluster
    buildCommand: cd web && npm ci && npm run build   # the build also installs ../api's packages
    startCommand: cd web && npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: MONGODB_URI
        sync: false      # your MongoDB Atlas connection string
      - key: MONGODB_DB
        value: partsdesk
      - key: SESSION_SECRET
        sync: false      # a random string of 32+ characters. Changing it signs everyone out.
      - key: ANTHROPIC_API_KEY
        sync: false      # optional: turns on "Read message into items". Leave empty to skip.

  # WhatsApp intake (optional): reads the business WhatsApp and turns parts requests into enquiries.
  # Runs apart from the web service so a website deploy doesn't drop the WhatsApp connection. Keep it at one instance.
  - type: worker
    name: a2z-whatsapp
    runtime: node
    plan: starter        # $7/month. Background workers have no free plan.
    region: frankfurt
    buildCommand: cd wa && npm run build   # also installs ../api's packages, which it shares
    startCommand: cd wa && npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false      # the same Atlas connection string as the web service
      - key: MONGODB_DB
        value: partsdesk
      - key: ANTHROPIC_API_KEY
        sync: false      # reads messages and photos. Without it, everything waits in the WhatsApp tab.
      - key: OPENAI_API_KEY
        sync: false      # voice notes (Whisper). Or set DEEPGRAM_API_KEY instead.
      - key: WA_AUTO_CONFIDENCE
        value: "0.85"    # how sure the reader must be to create an enquiry by itself; "off" sends everything to review
      - key: WA_CHATS
        value: all       # "groups" ignores direct chats
